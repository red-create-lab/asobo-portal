<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>請求書ジェネレーター</title>
<style>
  :root{
    --pink:#E5147D;
    --yellow:#F5B90E;
    --dark:#231F20;
    --gray-bg:#F4F5F7;
    --border:#E2E2E4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
    background:var(--gray-bg);
    color:var(--dark);
  }
  .layout{
    display:flex;
    min-height:100vh;
  }
  .panel{
    width:400px;
    flex-shrink:0;
    background:#fff;
    border-right:1px solid var(--border);
    padding:24px;
    overflow-y:auto;
    height:100vh;
    position:sticky;
    top:0;
  }
  .panel h2{
    font-size:15px;
    margin:0 0 12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--pink);
    color:var(--pink);
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block;
    font-size:11px;
    color:#777;
    margin-bottom:4px;
  }
  .field input, .field textarea{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:13px;
    font-family:inherit;
  }
  .field textarea{ resize:vertical; }
  .row2{ display:flex; gap:8px; }
  .row2 > div{ flex:1; }
  details{
    margin-bottom:16px;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 12px;
  }
  details summary{
    cursor:pointer;
    font-size:12px;
    color:#666;
    font-weight:bold;
    padding:4px 0;
  }
  .item-row{
    border:1px solid var(--border);
    border-radius:8px;
    padding:34px 10px 10px;
    margin-bottom:8px;
    position:relative;
    background:#FAFAFB;
  }
  .item-row .row-btns{
    position:absolute;
    top:6px;
    right:6px;
    display:flex;
    gap:6px;
  }
  .item-row .row-btns button{
    background:#fff;
    border:1px solid var(--border);
    color:#888;
    cursor:pointer;
    font-size:11px;
    line-height:1;
    padding:4px 7px;
    border-radius:5px;
    display:flex;
    align-items:center;
    gap:3px;
    white-space:nowrap;
  }
  .item-row .row-btns button:hover{ color:var(--pink); border-color:var(--pink); background:#FDF0F6; }
  .add-btn{
    width:100%;
    padding:8px;
    border:1.5px dashed var(--pink);
    background:#fff;
    color:var(--pink);
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
    font-weight:bold;
  }
  .add-btn:hover{ background:#FDF0F6; }
  .print-btn{
    width:100%;
    padding:12px;
    background:var(--pink);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
    letter-spacing:0.03em;
  }
  .print-btn:hover{ background:#c91169; }
  .version-label{
    text-align:center;
    font-size:10px;
    color:#bbb;
    margin-top:10px;
    letter-spacing:0.05em;
  }
  .preview-wrap{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 20px;
    overflow-y:auto;
  }
  .sheet{
    width:210mm;
    min-height:297mm;
    background:#fff;
    box-shadow:0 4px 24px rgba(0,0,0,0.12);
    padding:18mm 16mm;
  }
  .logo-wrap{
    text-align:center;
    margin-bottom:6px;
  }
  .logo-wrap img{
    height:70px;
  }
  .doc-title{
    text-align:center;
    font-size:30px;
    font-weight:700;
    letter-spacing:0.5em;
    margin:14px 0 24px;
    padding-left:0.5em;
  }
  .meta{
    font-size:12px;
    line-height:1.8;
    margin-bottom:20px;
  }
  .client{
    font-size:17px;
    font-weight:bold;
    border-bottom:2px solid var(--dark);
    display:inline-block;
    padding-bottom:4px;
    margin-bottom:6px;
  }
  .lead{ font-size:12px; margin-bottom:20px; }
  .amount-box{
    width:60%;
    margin:0 0 26px;
    border:1px solid var(--dark);
  }
  .amount-head{
    background:var(--yellow);
    text-align:center;
    font-weight:bold;
    font-size:13px;
    padding:8px;
  }
  .amount-value{
    text-align:center;
    font-size:30px;
    font-weight:800;
    padding:14px;
  }
  table.items{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    margin-bottom:20px;
  }
  table.items th{
    background:var(--pink);
    color:#fff;
    padding:8px 10px;
    text-align:left;
    font-size:12px;
  }
  table.items td{
    padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  table.items td.num, table.items th.num{ text-align:right; }
  table.items tr.total-row td{
    border-top:2px solid var(--dark);
    border-bottom:none;
    font-weight:bold;
  }
  .section-title{
    font-size:12px;
    font-weight:bold;
    margin:16px 0 4px;
  }
  .section-body{
    font-size:12px;
    line-height:1.7;
    white-space:pre-line;
  }
  .footer-company{
    margin-top:24px;
    font-size:12px;
    line-height:1.8;
  }
  @media print{
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
    html, body{ margin:0; padding:0; background:#fff; height:auto; }
    .layout{ display:block; height:auto; }
    .panel{ display:none; }
    .preview-wrap{ display:block; padding:0; margin:0; overflow:visible; height:auto; }
    .sheet{
      box-shadow:none;
      width:100%;
      min-height:auto;
      margin:0;
      padding:14mm 14mm;
    }
    @page{ size:A4; margin:0; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="panel">
    <h2>基本情報</h2>
    <div class="row2">
      <div class="field"><label>発行日</label><input type="date" id="issueDate"></div>
      <div class="field"><label>請求書番号</label><input type="text" id="invoiceNo"></div>
    </div>
    <div class="field"><label>宛先（会社名・敬称込み）</label><input type="text" id="clientName" placeholder="例：株式会社〇〇〇 御中"></div>
    <div class="field"><label>支払期限</label><input type="date" id="dueDate"></div>

    <h2>明細</h2>
    <div id="items"></div>
    <button class="add-btn" onclick="addItem()">＋ 明細行を追加</button>

    <h2 style="margin-top:20px;">備考</h2>
    <div class="field"><textarea id="notes" rows="2" placeholder="例：xxxx年xx月 体育指導料"></textarea></div>

    <details>
      <summary>会社情報・振込先を編集</summary>
      <div class="field"><label>会社名</label><input type="text" id="companyName"></div>
      <div class="field"><label>郵便番号</label><input type="text" id="companyZip" placeholder="例：270-0034"></div>
      <div class="field"><label>住所</label><input type="text" id="companyAddress" placeholder="例：千葉県松戸市新松戸3-43 大塚ビル2階"></div>
      <div class="field"><label>電話番号</label><input type="text" id="companyTel"></div>
      <div class="field"><label>銀行名</label><input type="text" id="bankName" placeholder="例：千葉銀行"></div>
      <div class="field"><label>支店名</label><input type="text" id="bankBranchName" placeholder="例：新松戸支店"></div>
      <div class="row2">
        <div class="field"><label>口座種別</label>
          <select id="bankAccountType" style="width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;">
            <option value="普通">普通</option>
            <option value="当座">当座</option>
          </select>
        </div>
        <div class="field"><label>口座番号</label><input type="text" id="bankAccountNo" placeholder="例：3845655"></div>
      </div>
    </details>

    <button class="print-btn" onclick="window.print()">印刷 / PDFで保存</button>
    <div class="version-label">請求書ジェネレーター v1.0</div>
  </div>

      <div class="doc-title">請求書</div>
      <div class="meta">
        発行日：<span id="outIssueDate"></span><br>
        請求書番号：<span id="outInvoiceNo"></span>
      </div>
      <div class="client" id="outClientName">Globallykids 御中</div>
      <div class="lead">下記の通りご請求申し上げます。</div>

      <div class="amount-box">
        <div class="amount-head">ご請求金額（税込）</div>
        <div class="amount-value">¥<span id="outTotal">0</span></div>
      </div>

      <table class="items">
        <thead>
          <tr><th>日付</th><th>内容</th><th class="num">数量</th><th class="num">単価</th><th class="num">金額</th></tr>
        </thead>
        <tbody id="outItems"></tbody>
        <tfoot>
          <tr class="total-row"><td colspan="4" style="text-align:right;">合計</td><td class="num"><span id="outTotal2">0</span>円</td></tr>
        </tfoot>
      </table>

      <div class="section-title">備考</div>
      <div class="section-body" id="outNotes"></div>

      <div class="section-title" style="margin-top:16px;">振込先</div>
      <div class="section-body"><span id="outBankBranch"></span><br><span id="outBankAccount"></span><br><span id="outCompanyName1"></span></div>

      <div class="footer-company">
        <span id="outCompanyName2"></span><br>
        <span id="outCompanyAddress"></span><br>
        TEL：<span id="outCompanyTel"></span><br>
        <span id="outDueLine"></span>
      </div>
    </div>
  </div>
</div>

<script>
let items = [
  {date:"", content:"", qty:1, price:0}
];

const defaults = {
  companyName:"株式会社RED MAX",
  companyZip:"270-0034",
  companyAddress:"千葉県松戸市新松戸3-43 大塚ビル2階",
  companyTel:"080-6638-4734",
  bankName:"千葉銀行",
  bankBranchName:"新松戸支店",
  bankAccountType:"普通",
  bankAccountNo:"3845655"
};

function fmt(n){ return Number(n||0).toLocaleString('ja-JP'); }
function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split('-');
  return `${y}年${Number(m)}月${Number(d)}日`;
}

function renderItemsForm(){
  const wrap = document.getElementById('items');
  wrap.innerHTML = '';
  items.forEach((it, idx) => {
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
      <div class="row-btns">
        <button title="複写" onclick="duplicateItem(${idx})">⧉ 複写</button>
        <button title="削除" onclick="removeItem(${idx})">✕ 削除</button>
      </div>
      <div class="field"><label>日付</label><input type="date" value="${it.date}" onchange="updateItem(${idx},'date',this.value)"></div>
      <div class="field"><label>内容</label><input type="text" value="${it.content}" placeholder="例：体育指導料" onchange="updateItem(${idx},'content',this.value)"></div>
      <div class="row2">
        <div class="field"><label>数量</label><input type="number" value="${it.qty}" onchange="updateItem(${idx},'qty',this.value)"></div>
        <div class="field"><label>単価</label><input type="number" value="${it.price}" onchange="updateItem(${idx},'price',this.value)"></div>
      </div>
    `;
    wrap.appendChild(div);
  });
}

function addItem(){
  items.push({date:"", content:"", qty:1, price:0});
  renderItemsForm();
  renderPreview();
}
function duplicateItem(idx){
  const copy = Object.assign({}, items[idx]);
  items.splice(idx+1, 0, copy);
  renderItemsForm();
  renderPreview();
}
function removeItem(idx){
  items.splice(idx,1);
  renderItemsForm();
  renderPreview();
}
function updateItem(idx, key, val){
  items[idx][key] = (key==='qty'||key==='price') ? Number(val) : val;
  renderPreview();
}

function renderPreview(){
  document.getElementById('outIssueDate').textContent = fmtDate(document.getElementById('issueDate').value);
  document.getElementById('outInvoiceNo').textContent = document.getElementById('invoiceNo').value;
  document.getElementById('outClientName').textContent = document.getElementById('clientName').value || '　';
  document.getElementById('outNotes').textContent = document.getElementById('notes').value;

  const companyName = document.getElementById('companyName').value || defaults.companyName;
  const companyZip = document.getElementById('companyZip').value || defaults.companyZip;
  const companyAddress = document.getElementById('companyAddress').value || defaults.companyAddress;
  const companyTel = document.getElementById('companyTel').value || defaults.companyTel;
  const bankName = document.getElementById('bankName').value || defaults.bankName;
  const bankBranchName = document.getElementById('bankBranchName').value || defaults.bankBranchName;
  const bankAccountType = document.getElementById('bankAccountType').value || defaults.bankAccountType;
  const bankAccountNo = document.getElementById('bankAccountNo').value || defaults.bankAccountNo;

  document.getElementById('outCompanyName1').textContent = companyName;
  document.getElementById('outCompanyName2').textContent = companyName;
  document.getElementById('outCompanyAddress').textContent = `〒${companyZip} ${companyAddress}`;
  document.getElementById('outCompanyTel').textContent = companyTel;
  document.getElementById('outBankBranch').textContent = `${bankName} ${bankBranchName}`;
  document.getElementById('outBankAccount').textContent = `${bankAccountType} ${bankAccountNo}`;

  const due = document.getElementById('dueDate').value;
  document.getElementById('outDueLine').textContent = due ? `支払期限：${fmtDate(due)}` : '';

  const tbody = document.getElementById('outItems');
  tbody.innerHTML = '';
  let total = 0;
  items.forEach(it => {
    const amount = (Number(it.qty)||0) * (Number(it.price)||0);
    total += amount;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${it.date ? fmtDateSlash(it.date) : ''}</td>
      <td>${it.content}</td>
      <td class="num">${fmt(it.qty)}</td>
      <td class="num">${fmt(it.price)}円</td>
      <td class="num">${fmt(amount)}円</td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('outTotal').textContent = fmt(total);
  document.getElementById('outTotal2').textContent = fmt(total);
}

function fmtDateSlash(iso){
  const [y,m,d] = iso.split('-');
  return `${y}/${Number(m)}/${Number(d)}`;
}
